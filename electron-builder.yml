appId: com.flyffbind.app
productName: BINDit
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/ahk
    to: ahk
# Only ship the English Chromium language pack (the UI is English); saves ~40 MB.
electronLanguages:
  - en-US
compression: maximum
# Where installed copies look for updates (electron-updater reads latest.yml from the latest release).
publish:
  - provider: github
    owner: vmacalolooy
    repo: BINDit
    releaseType: release
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  # no spaces: GitHub renames them to dots, which would break the link in latest.yml
  artifactName: BINDit-Setup-${version}.exe
  shortcutName: BINDit
portable:
  artifactName: BINDit-${version}-portable.exe
